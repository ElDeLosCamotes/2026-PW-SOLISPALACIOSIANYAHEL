<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header><a id="volver-detalle" href="./detalle.html">Volver al detalle del Taller</a></header>
<main>
  <form class="formulario-registro">
    <h1>Formulario de Registro de Asistencia</h1>

    <div id="mensaje" aria-live="polite"></div>

    <label for="nombre">Nombre Completo</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="boleta">Boleta</label>
    <input type="text" id="boleta" name="boleta" required>

    <button type="submit">Registrar Asistencia</button>
  </form>
</main>
<script>
  var form = document.querySelector('.formulario-registro');
  var mensaje = document.getElementById('mensaje');
  // mostrar el taller en el header/volver según el id pasado en la URL
  (function(){
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    if(id){
      var volver = document.getElementById('volver-detalle');
      if(volver) volver.href = './detalle.html?id=' + encodeURIComponent(id);
    }
  })();
  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      mensaje.className = '';
      mensaje.textContent = '';
      var inputs = form.querySelectorAll('input');
      inputs.forEach(function(i){ i.classList.remove('input-invalido'); });

      var nombre = form.nombre.value || '';
      var boleta = form.boleta.value || '';

      if(!nombre.trim() || !boleta.trim() || !/^\d+$/.test(boleta.trim())){
        mensaje.className = 'registro-fallido';
        mensaje.textContent = 'Error: por favor complete los campos correctamente. La boleta debe ser numérica.';
        if(!nombre.trim()) form.nombre.classList.add('input-invalido');
        if(!boleta.trim() || !/^\d+$/.test(boleta.trim())) form.boleta.classList.add('input-invalido');
        return;
      }

      mensaje.className = 'registro-exitoso';
      mensaje.textContent = 'Registro realizado correctamente.';
      form.reset();
    });
  }
</script>
</body>
</html>
