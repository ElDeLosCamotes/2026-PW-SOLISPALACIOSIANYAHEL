<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Node</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Ejercicios con Node</h1>
    </header>
    <main>
        <section class="ejercicio">
            <h2 id="titulo-arreglos"> Arreglos del Codigo <code>01-arreglos.js</code></h2>
            <p>Selecciona una operación para ejecutar</p>
            <div class="tabala-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>

            <form id="formulario-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo" name="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">ForEach - Lista Simple</option>
                        <option value="map">map - Copia solo Nombres</option>
                        <option value="filter">filter - Filtrar talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                        <option value="reduce">reduce - Total de inscritos</option>
                        <option value="disponibles">filter + map - Talleres con cupo disponible</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="formulario-arreglos"></output>
        </section>

        <section class="ejercicio">
            <h2>Objetos <code>02-objetos-json.js</code></h2>
            <p>Selecciona un taller y una operación para consultar sus propiedades.</p>

            <form id="formulario-objetos" class="formulario">
                <div class="campos">
                    <label for="taller-objeto">Taller</label>
                    <select name="taller-objeto" id="taller-objeto"></select>
                </div>
                <div class="campos">
                    <label for="operacion-objeto">Operación</label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys - Mostrar propiedades</option>
                        <option value="values">Object.values - Mostrar valores</option>
                        <option value="entries">Object.entries - Mostrar campos y valores</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-objeto" for="formulario-objetos"></output>
        </section>
    </main>

    <script src="./js/01-arreglos.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/02-objetos-json.js"></script>
</body>
</html>
